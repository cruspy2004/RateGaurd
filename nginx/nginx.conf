events {}

http {
    upstream rg_nodes {
        server app:3000 max_fails=2 fail_timeout=3s;
        keepalive 32;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://rg_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
